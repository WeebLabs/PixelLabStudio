name: Release (Windows)

# Builds the Windows installer + portable zip for a version tag and attaches
# them to a DRAFT GitHub release (created if missing) so notes and the macOS
# build can be added before publishing. Tags must equal "v" + config/version
# in project.godot (e.g. v1.7.0-alpha.3); installer/windows/build.ps1 enforces it.
#
# Assets are never replaced: a fix ships as a new version so the auto-updater
# can see it. Re-running the job on a tag that already has them fails.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.7.0-alpha.3)'
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: 4.6.3
  # Same pinned editor as test.yml.
  GODOT_SHA256: e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90
  # Agility SDK D3D12Core.dll bundled for the d3d12 driver (window transparency);
  # must be >= rendering/rendering_device/d3d12/agility_sdk_version (618).
  AGILITY_SDK_VERSION: 1.619.3

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: recursive

      - name: Cache Godot + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .tools/godot
            ~\AppData\Roaming\Godot\export_templates
          key: godot-${{ env.GODOT_VERSION }}-agility-${{ env.AGILITY_SDK_VERSION }}

      - name: Install Godot, export templates and Agility SDK
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          $dl = "$env:RUNNER_TEMP\dl"; New-Item -ItemType Directory -Force $dl, .tools/godot | Out-Null
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip" -OutFile "$dl\godot.zip"
          if ((Get-FileHash "$dl\godot.zip" -Algorithm SHA256).Hash.ToLower() -ne $env:GODOT_SHA256) { throw "Godot checksum mismatch" }
          Expand-Archive "$dl\godot.zip" .tools/godot -Force
          # Templates are verified against the release's own SHA512 list.
          # Expand-Archive only accepts a .zip extension.
          $tpz = "Godot_v$env:GODOT_VERSION-stable_export_templates.tpz"
          Invoke-WebRequest "$base/SHA512-SUMS.txt" -OutFile "$dl\SHA512-SUMS.txt"
          Invoke-WebRequest "$base/$tpz" -OutFile "$dl\templates.zip"
          $want = (Select-String -Path "$dl\SHA512-SUMS.txt" -SimpleMatch $tpz).Line.Split(" ")[0]
          if ((Get-FileHash "$dl\templates.zip" -Algorithm SHA512).Hash.ToLower() -ne $want) { throw "Export templates checksum mismatch" }
          Expand-Archive "$dl\templates.zip" "$dl\tpl" -Force
          $tpl = "$env:APPDATA\Godot\export_templates\$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $tpl | Out-Null
          Copy-Item "$dl\tpl\templates\*" $tpl -Recurse -Force
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Direct3D.D3D12/$env:AGILITY_SDK_VERSION" -OutFile "$dl\agility.zip"
          Expand-Archive "$dl\agility.zip" "$dl\agility" -Force
          Copy-Item "$dl\agility\build\native\bin\x64\D3D12Core.dll" "$tpl\D3D12Core.x86_64.dll"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Import project
        shell: pwsh
        run: |
          $godot = (Resolve-Path ".tools/godot/Godot_v$env:GODOT_VERSION-stable_win64.exe").Path
          "GODOT_BIN=$godot" | Out-File $env:GITHUB_ENV -Append
          # A fresh checkout has no .godot/ import cache; export needs it. The
          # editor may exit non-zero on teardown even when the import succeeded.
          & $godot --headless --recovery-mode --editor --path . --import --quit 2>&1 | Out-Null
          exit 0

      - name: Build installer and zip
        shell: pwsh
        run: ./installer/windows/build.ps1 -Tag $env:TAG -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

      - name: Attach to draft release
        shell: pwsh
        run: |
          $files = Get-ChildItem .artifacts/installer/windows -File | ForEach-Object FullName
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $extra = @()
            if ($env:TAG -match '-') { $extra += '--prerelease' }
            gh release create $env:TAG --draft --verify-tag @extra --title "PixelLab Studio $env:TAG" --notes "Draft: add release notes and the macOS build, then publish."
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $env:TAG @files
